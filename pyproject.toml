[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panescape"
version = "0.1.0"
description = "True-to-scale wallpapers across monitors of different sizes, resolutions and orientations (Linux: GNOME, KDE Plasma, sway, Hyprland)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Kieran Ralston" }]
keywords = ["wallpaper", "multi-monitor", "gnome", "slideshow", "bezel"]
classifiers = [
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = ["Pillow>=10.1", "PyYAML>=6", "ruamel.yaml>=0.18"]

[project.urls]
Homepage = "https://github.com/keo99/panescape"
Issues = "https://github.com/keo99/panescape/issues"

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5", "keyring>=23"]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
panescape = "panescape.cli:main"
panescape-apply = "panescape.cli:main_apply"

[project.gui-scripts]
panescape-gui = "panescape.gui:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
panescape = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "UP038"]  # UP038: isinstance(x, (A, B)) is clearer

[tool.pytest.ini_options]
testpaths = ["tests"]
